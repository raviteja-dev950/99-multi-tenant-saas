spring.application.name=99-multi-tenant-saas
server.port=${PORT\:8101}\n
spring.datasource.url=jdbc\:h2\:mem\:tenantdb\n
spring.datasource.username=sa
spring.datasource.password=\n
spring.jpa.hibernate.ddl-auto=update\n
spring.jpa.show-sql=true\n
spring.h2.console.enabled=true\n
spring.h2.console.path=/h2-console\n
spring.cache.type=caffeine\n
spring.cache.caffeine.spec=spring.cache.caffeine.spec\=maximumSize\=1000,expireAfterAccess\=600s,recordStats\n
